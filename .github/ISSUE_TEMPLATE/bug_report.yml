name: Bug report
description: Something in MidiPanel doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. License or payment questions: write to support@midipanel.com (private)."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller
      placeholder: e.g. Behringer X-Touch One
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: MidiPanel version
      description: "With the MidiPanel window open: MidiPanel menu → About MidiPanel"
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: e.g. macOS 15.5, MacBook Air M2
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Problem report (optional)
      description: "Menu-bar icon → Copy Diagnostic Report. Paste it here."
      render: text
